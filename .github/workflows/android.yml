name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to players (versionCode is set from the run number)"
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare signing key
        id: sign
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$B64" ]; then
            echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$K_PASS" >> "$GITHUB_ENV"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signing secrets found. Building with a throw-away TEST key. Do not upload this file to Google Play."
            TMP_PASS="test-$(date +%s)"
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" -alias test -keyalg RSA -keysize 2048 -validity 30 -storepass "$TMP_PASS" -keypass "$TMP_PASS" -dname "CN=TEST ONLY"
            echo "KEYSTORE_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=test" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$TMP_PASS" >> "$GITHUB_ENV"
            echo "kind=TEST-ONLY" >> "$GITHUB_OUTPUT"
          fi
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: bash android-app/build.sh

      - name: Inspect the bundle (diagnostics)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cd android-app/out || exit 0
          echo "== jarsigner =="; jarsigner -verify -verbose -certs fools-knife.aab 2>&1 | tail -25
          echo "== keytool cert =="; keytool -printcert -jarfile fools-knife.aab 2>&1 | head -20
          gh release download -R google/bundletool -p 'bundletool-all-*.jar' -O bundletool.jar --clobber
          echo "== bundletool validate =="; java -jar bundletool.jar validate --bundle=fools-knife.aab 2>&1 | tail -20
          echo "== manifest =="; java -jar bundletool.jar dump manifest --bundle=fools-knife.aab 2>&1 | head -60
          echo "== files =="; unzip -l fools-knife.aab | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: fools-knife-android-${{ steps.sign.outputs.kind }}
          path: |
            android-app/out/fools-knife.aab
            android-app/out/fools-knife.apk
          retention-days: 30
