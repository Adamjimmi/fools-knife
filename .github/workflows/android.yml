name: Build Android app

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to players (versionCode is set from the run number)"
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check signing secrets
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$B64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_B64 is missing. See android-app/README.md"
            exit 1
          fi
          echo "$B64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: bash android-app/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: fools-knife-android
          path: |
            android-app/out/fools-knife.aab
            android-app/out/fools-knife.apk
          retention-days: 30
